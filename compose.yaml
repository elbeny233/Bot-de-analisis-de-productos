services:
  radar:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RADAR_DATABASE_URL: sqlite:////app/data/radar.db
      RADAR_PUBLICATIONS_ENABLED: "false"
    volumes:
      - radar-data:/app/data
      - radar-backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  radar-data:
  radar-backups:
